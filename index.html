<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kopenhagen Stadtplan – Sehenswürdigkeiten, Essen, Touren</title>
<meta name="description" content="Interaktive Karte für Kopenhagens Stadtzentrum: Sehenswürdigkeiten mit Eintrittspreisen, Hop-On-Hop-Off-Busse, Kanaltouren, Frühstückscafés, Restaurants mit Preisvergleich, Supermärkte und praktische Orte – mit echten Öffnungszeiten.">
<meta name="author" content="Kopenhagen Stadtplan">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f6b66">
<meta property="og:title" content="Kopenhagen Stadtplan">
<meta property="og:description" content="Interaktive Karte mit Sehenswürdigkeiten, Touren &amp; Rundfahrten (Hop-On-Hop-Off, Kanaltouren), Frühstück, Restaurants, Kaffee &amp; Bäckereien, Supermärkten und praktischen Orten – mit Öffnungszeiten, Preisen und Fotos.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">🧭</span>
    <span class="brand-text">
      <strong>Kopenhagen</strong>
      <small>Stadtzentrum · Sehenswertes, Essen &amp; Einkaufen</small>
    </span>
  </div>

  <div class="search-wrap">
    <span class="search-ico" aria-hidden="true">🔍</span>
    <input id="search" type="search" placeholder="Suchen: Smørrebrød, Nyhavn, Supermarkt …" autocomplete="off" aria-label="Orte durchsuchen">
  </div>

  <div class="topbar-actions">
    <button id="rainBtn" class="btn btn-rain" type="button" hidden>🌧 Regen</button>
    <button id="compare" class="btn btn-soft" type="button">💸 Preisvergleich</button>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Design wechseln">◐</button>
  </div>
</header>

<main class="app">
  <aside class="sidebar" aria-label="Ortsliste und Filter">
    <div class="sheet-head">
      <span class="sheet-grip" aria-hidden="true"></span>
      <strong>Orte &amp; Filter</strong>
      <button id="sheetClose" class="icon-btn" type="button" aria-label="Liste schließen">✕</button>
    </div>

    <div class="controls">
      <div class="chips" id="chips" role="group" aria-label="Kategorien"></div>
      <div class="tagbar" id="tagbar" role="group" aria-label="Themenfilter" hidden></div>

      <div class="control-row">
        <label class="switch">
          <input type="checkbox" id="openOnly">
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span class="switch-label">Nur jetzt geöffnet</span>
        </label>

        <label class="select-wrap">
          <span class="sr-only">Sortierung</span>
          <select id="sort">
            <option value="empfohlen">Empfehlung</option>
            <option value="name">Name A–Z</option>
            <option value="rating">Bewertung</option>
            <option value="price">Preis aufsteigend</option>
            <option value="distance">Entfernung</option>
          </select>
        </label>
      </div>

      <div class="control-row">
        <button id="locateBtn" class="btn btn-ghost btn-sm" type="button">📍 In meiner Nähe</button>
        <button id="favBtn" class="btn btn-ghost btn-sm" type="button" aria-pressed="false" title="Nur gemerkte Orte">★ Gemerkt <span id="favCount" class="fav-count">0</span></button>
        <button id="gpxBtn" class="btn btn-ghost btn-sm" type="button" title="Erst Orte merken, dann exportieren">⬇ GPX</button>
        <span class="hint" id="count"></span>
      </div>
    </div>

    <ul class="list" id="list" aria-live="polite"></ul>

    <footer class="sidebar-foot">
      <span id="dataStamp">Datenstand: –</span>
      <span>Öffnungszeiten: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL) · Preise &amp; Bewertungen: öffentliche Quellen · alles ohne Gewähr</span>
    </footer>
  </aside>

  <div class="map-wrap">
    <div id="map" role="application" aria-label="Karte von Kopenhagen"></div>
    <button id="locateFloat" class="locate-float" type="button" aria-label="Eigenen Standort anzeigen">◎</button>
    <noscript><p class="noscript">Für die Karte wird JavaScript benötigt.</p></noscript>
  </div>
</main>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<button id="sidebarToggle" class="sidebar-toggle" type="button" aria-expanded="false" aria-controls="list">☰ Liste</button>

<aside class="drawer" id="drawer" hidden aria-label="Details" role="dialog" aria-modal="false"></aside>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">Preisvergleich Restaurants &amp; Fast Food</h2>
      <button id="modalClose" class="icon-btn" type="button" aria-label="Schließen">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="assets/hours.js"></script>
<script src="assets/weather.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
